# ====================================================================
# Kubernetes Secret Template - Do NOT commit real production secrets!
# Apply using: kubectl apply -f secret.yaml
# ====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: attendance-backend-secrets
  namespace: academic-system
type: Opaque
stringData:
  # Base64 or plain string template for external integrations (e.g. SMTP or auth tokens)
  API_SECRET_KEY: "replace-with-secure-random-token-in-production"
  ADMIN_EMAIL: "admin@campus.edu"

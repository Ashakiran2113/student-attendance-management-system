apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-backend
  namespace: academic-system
  labels:
    app: attendance-backend
spec:
  replicas: 1 # Single replica preserves SQLite WAL single-writer disk lock safety
  selector:
    matchLabels:
      app: attendance-backend
  strategy:
    type: Recreate # Clean volume detachment before starting new pod
  template:
    metadata:
      labels:
        app: attendance-backend
    spec:
      containers:
        - name: backend
          image: student-attendance-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: attendance-backend-config
            - secretRef:
                name: attendance-backend-secrets
          volumeMounts:
            - name: sqlite-persistent-storage
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
      volumes:
        - name: sqlite-persistent-storage
          persistentVolumeClaim:
            claimName: attendance-sqlite-pvc

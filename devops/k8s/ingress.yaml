apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attendance-system-ingress
  namespace: academic-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: attendance.campus.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: attendance-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: attendance-frontend-svc
                port:
                  number: 80

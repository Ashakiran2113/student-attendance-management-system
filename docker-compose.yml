version: '3.8'

services:
  attendance-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-backend-svc
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/data/attendance.db
      - DEFAULT_ATTENDANCE_THRESHOLD=75
      - CORS_ORIGIN=*
    volumes:
      # Persistent SQLite database storage across container re-deployments
      - attendance_db_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - attendance_network

  attendance-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance-frontend-svc
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      attendance-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - attendance_network

volumes:
  attendance_db_data:
    name: student_attendance_persistent_db

networks:
  attendance_network:
    name: student_attendance_network
    driver: bridge
